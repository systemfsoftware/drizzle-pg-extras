name: CI

# One static-checks job and the service-backed test jobs per push and pull request. The static checks run
# once on the frozen lockfile; commitlint lints the pull request's title and body, which is what the squash
# message carries. A newer push to a pull request cancels its older run; main never cancels.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec attw --pack .
      - run: pnpm exec publint
      - if: github.event_name == 'pull_request'
        name: Lint the squash message
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY" | pnpm exec commitlint --verbose

  test:
    name: test (node ${{ matrix.node }}, drizzle 0.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          POSTGRES_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras

  test-rc:
    name: test (node 24, drizzle 1.0-rc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The rc install mutates this job's own dependency tree only (KTD3); it never feeds a static check.
      - run: pnpm install --frozen-lockfile && pnpm add -D drizzle-orm@rc drizzle-kit@rc
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          POSTGRES_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras

  timescale:
    name: test (timescaledb 2.32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      timescaledb:
        image: timescale/timescaledb:2.32.1-pg16@sha256:5d7a2f9d9d593315368338aa6054fda37d7707b4a12a912e30dcb7523385e2b4
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TIMESCALE_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras
