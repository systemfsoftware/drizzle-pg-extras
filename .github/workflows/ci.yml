name: CI

# One full gate per tree. A pull request runs it on its head; a Mergify queue draft runs it on the merged tree and is
# the binding result, because the ruleset's required check is injected on the queue branch. A long-lived branch that
# is not a pull request runs nothing, and a push to main runs it once for the commit that landed. Commit linting of
# the squashed message lives in `squash-message.yml`, so a title or body edit never re-runs this gate.
# A newer push to a pull request cancels its older run; main and Mergify queue drafts never cancel.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-store
        uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      # Only this job, and only on a push to main, writes the pnpm store; every other run restores it read-only.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.hit != 'true'
        uses: ./.github/actions/pnpm-store
        with:
          mode: save
          key: ${{ steps.pnpm-store.outputs.key }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # attw and publint guard the built dual-format output, so the build precedes them.
      - run: pnpm build
      - run: pnpm --filter @systemfsoftware/drizzle-pg-extras exec attw --pack .
      - run: pnpm --filter @systemfsoftware/drizzle-pg-extras exec publint

  test:
    name: test (node ${{ matrix.node }}, drizzle 0.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          POSTGRES_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras

  test-rc:
    name: test (node 24, drizzle 1.0-rc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      # The rc install mutates this job's own dependency tree only (KTD3); this job runs tests only,
      # so the mutation never feeds a static check — those run once, on the frozen lockfile.
      - run: pnpm install --frozen-lockfile && pnpm add -D --filter @systemfsoftware/drizzle-pg-extras drizzle-orm@1.0.0-rc.5 drizzle-kit@1.0.0-rc.5
      - run: pnpm test
        env:
          POSTGRES_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras

  timescale:
    name: test (timescaledb 2.32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      timescaledb:
        image: timescale/timescaledb:2.32.1-pg16@sha256:5d7a2f9d9d593315368338aa6054fda37d7707b4a12a912e30dcb7523385e2b4
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: drizzle_pg_extras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U extras -d drizzle_pg_extras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TIMESCALE_URL: postgres://extras:extras@localhost:5432/drizzle_pg_extras

  # The one check the ruleset requires and the Mergify queue gates on; the name matches the shared CI of the other
  # systemfsoftware repositories. List every other job in `needs`: a job left out is not gated. The job always runs,
  # and any dependency that did not conclude `success` — skipped, cancelled or failed — fails it, so a run that did
  # not execute the gate can never stand in for one that passed.
  check:
    name: checks / check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-checks, test, test-rc, timescale]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "A required job finished as: $result"; exit 1; }
          done
